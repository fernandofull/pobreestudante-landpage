<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pobre Estudante · Seu espaço de estudos</title>
    <meta name="theme-color" content="#090c0a">
    <link rel="icon" type="image/png" href="/sistema/static/imagens/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/sistema/static/css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <link href="/sistema/static/css/brand.css?v=20261031d" rel="stylesheet">
</head>
<body>
    

    

    <main id="main-content">
<div class="container px-3 auth-shell">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
            <div class="card login-card my-5">
                <div class="card-header py-4">
                    <div class="logo-container">
                        <img src="/sistema/static/imagens/logo.png" alt="Pobre Estudante" class="img-fluid mb-3" style="max-width: 120px;">
                        <p class="auth-eyebrow">Pobre Estudante</p>
                        <h1 class="h3 text-center mb-0 text-light">Seu próximo passo começa aqui.</h1>
                        <p class="auth-description">Organize seus estudos, acompanhe seu ritmo e continue evoluindo.</p>
                    </div>
                </div>
                <div class="card-body p-4">
                    


                    
                    <form method="POST" action="/sistema/login">
                        <input type="hidden" name="csrf_token" value="<redacted>">
                        <div class="mb-4">
                            <label for="usuario" class="form-label">Usuário</label>
                            <input type="text" class="form-control form-control-lg" id="usuario" name="usuario" autocomplete="username" placeholder="Seu usuário ou e-mail" required>
                        </div>
                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control form-control-lg" id="senha" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Entrar na minha conta <i class="bi bi-arrow-right ms-2" aria-hidden="true"></i></button>
                        </div>
                    </form>
                    <div class="d-grid gap-2 mt-3">
                        <a class="btn btn-outline-primary" href="/sistema/criar-usuario">Criar usu&#225;rio padr&#227;o</a>
                        <a class="btn btn-link" href="/sistema/recuperar-senha">Esqueci minha senha</a>
                    </div>
                    <p class="auth-footer mb-0">Um dia de cada vez. Um objetivo em mente.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Código do tema escuro/claro
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.querySelector('.theme-toggle i');
            icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) {
                icon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        });
    </script>
</body>
</html>
